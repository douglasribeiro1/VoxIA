name: Compilar VoxIA para Windows (EXE)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar VoxIA.exe e pasta de compartilhamento
    runs-on: windows-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Compilar VoxIA.exe com o compilador do .NET Framework
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $uiaClient = (Get-ChildItem "C:\Windows\Microsoft.NET\assembly" -Recurse -Filter UIAutomationClient.dll | Select-Object -First 1).FullName
          $uiaTypes = (Get-ChildItem "C:\Windows\Microsoft.NET\assembly" -Recurse -Filter UIAutomationTypes.dll | Select-Object -First 1).FullName
          $sources = Get-ChildItem -Path windows\src -Recurse -Filter *.cs | ForEach-Object { $_.FullName }
          & $csc /nologo /target:winexe /win32icon:windows\app.ico /win32manifest:windows\app.manifest /out:windows\VoxIA.exe `
            /r:System.dll,System.Drawing.dll,System.Windows.Forms.dll,System.Web.Extensions.dll,System.Net.Http.dll `
            "/r:$uiaClient" "/r:$uiaTypes" $sources
          if ($LASTEXITCODE -ne 0) { throw "Falha na compilacao do VoxIA.exe" }

      - name: Montar a pasta para compartilhar (sem chave de API)
        shell: pwsh
        run: |
          $dest = "output\VoxIA-Compartilhar"
          New-Item -ItemType Directory -Force "$dest\data" | Out-Null
          Copy-Item windows\VoxIA.exe "$dest\VoxIA.exe"
          Copy-Item VoxIA-Compartilhar\LEIAME.txt, VoxIA-Compartilhar\portable.txt $dest
          Copy-Item VoxIA-Compartilhar\data\.gitkeep "$dest\data\"
          # Código SHA-256 para quem recebe a pasta conferir que o .exe não foi alterado
          $hash = (Get-FileHash "$dest\VoxIA.exe" -Algorithm SHA256).Hash
          Set-Content -Path "$dest\VoxIA.exe.sha256.txt" -Value "$hash  VoxIA.exe" -Encoding ascii

      - name: Publicar a pasta como artefato para download
        uses: actions/upload-artifact@v4
        continue-on-error: true   # a cota de artefatos pode estourar; o .exe também é gravado no repositório
        with:
          name: VoxIA-Windows
          path: output/VoxIA-Compartilhar
          include-hidden-files: true
          retention-days: 3

      - name: Atualizar a pasta de compartilhamento no repositorio (somente master)
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Join-Path $PWD "windows\VoxIA.exe"
          $sha = Join-Path $PWD "output\VoxIA-Compartilhar\VoxIA.exe.sha256.txt"
          $repo = Join-Path $env:RUNNER_TEMP "repo"
          if (Test-Path $repo) { Remove-Item -Recurse -Force $repo }
          git clone -q "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" $repo
          if ($LASTEXITCODE -ne 0) { throw "Falha ao clonar o repositorio" }
          Set-Location $repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Copy-Item $exe "VoxIA-Compartilhar\VoxIA.exe" -Force
          Copy-Item $sha "VoxIA-Compartilhar\VoxIA.exe.sha256.txt" -Force
          git add VoxIA-Compartilhar/VoxIA.exe VoxIA-Compartilhar/VoxIA.exe.sha256.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -q -m "Atualiza VoxIA.exe para compartilhar (build automatico) [skip ci]"
            for ($i = 1; $i -le 3; $i++) {
              git pull -q --rebase origin master
              git push -q origin HEAD:master
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 5
            }
          }
