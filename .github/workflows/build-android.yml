name: Compilar Teclado Android (APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android

      - name: Dar permissao de execucao ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Preparar a chave de assinatura (segredos do repositorio)
        env:
          KEYSTORE_B64: ${{ secrets.VOXIA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/voxia-release.keystore"
            echo "VOXIA_KEYSTORE_PATH=$RUNNER_TEMP/voxia-release.keystore" >> "$GITHUB_ENV"
            echo "APK sera assinado com a chave propria do VoxIA."
          else
            echo "::warning::Segredo VOXIA_KEYSTORE_BASE64 nao configurado; o APK sera assinado com a chave de depuracao do repositorio."
          fi

      - name: Compilar APK (release, sem modo de depuracao)
        env:
          VOXIA_KEYSTORE_PASSWORD: ${{ secrets.VOXIA_KEYSTORE_PASSWORD }}
          VOXIA_KEY_ALIAS: ${{ secrets.VOXIA_KEY_ALIAS }}
          VOXIA_KEY_PASSWORD: ${{ secrets.VOXIA_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renomear e Preparar APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/VoxIA-Teclado-Android.apk
          rm -f "$RUNNER_TEMP/voxia-release.keystore"

      - name: Publicar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        continue-on-error: true   # a cota de artefatos pode estourar; o APK também é gravado no repositório
        with:
          name: VoxIA-Teclado-Android
          path: output/VoxIA-Teclado-Android.apk
          retention-days: 3

      - name: Atualizar o APK no repositorio (somente master)
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$PWD/output/VoxIA-Teclado-Android.apk"
          REPO="$RUNNER_TEMP/repo"
          rm -rf "$REPO"
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$REPO"
          cd "$REPO"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$APK" android/VoxIA-Teclado-Android.apk
          git add android/VoxIA-Teclado-Android.apk
          if ! git diff --cached --quiet; then
            git commit -q -m "Atualiza APK Android (build automatico) [skip ci]"
            for i in 1 2 3; do
              git pull -q --rebase origin master && git push -q origin HEAD:master && break
              sleep 5
            done
          fi
