name: Compilar Teclado Android (APK)

on:
  push:
    branches: [ "main", "master", "claude/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android

      - name: Dar permissao de execucao ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace


      - name: Renomear e Preparar APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/VoxIA-Teclado-Android.apk

      - name: Publicar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: VoxIA-Teclado-Android
          path: output/VoxIA-Teclado-Android.apk
          retention-days: 30

      - name: Atualizar o APK no repositorio (somente master)
        if: github.ref == 'refs/heads/master'
        run: |
          cp output/VoxIA-Teclado-Android.apk android/VoxIA-Teclado-Android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/VoxIA-Teclado-Android.apk
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza APK Android (build automatico) [skip ci]"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
