plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.voxia.keyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.voxia.keyboard"
        minSdk 26
        targetSdk 34
        // No GitHub Actions o número do build vira o versionCode: cresce a cada compilação, e a
        // busca de atualizações do app compara com ele (ver UpdateManager e build-android.yml)
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '16').toInteger())
        versionName "1.11.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    // Chave de depuração fixa: sem ela cada build do CI gera uma assinatura diferente
    // e o Android recusa instalar a atualização por cima da versão anterior.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        // Chave própria do VoxIA, vinda dos segredos do GitHub (ver .github/workflows/build-android.yml).
        // Enquanto os segredos não existirem, usa a chave de depuração acima, para o APK continuar
        // instalando por cima da versão que já está no celular.
        release {
            def releaseKeystore = System.getenv('VOXIA_KEYSTORE_PATH')
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('VOXIA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('VOXIA_KEY_ALIAS')
                keyPassword System.getenv('VOXIA_KEY_PASSWORD')
            } else {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        // O APK distribuído é o de release: sem modo de depuração, os dados do app não podem
        // ser lidos pelo cabo USB (adb run-as).
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Lifecycle & Activity KTX
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // OkHttp & Gson
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}
